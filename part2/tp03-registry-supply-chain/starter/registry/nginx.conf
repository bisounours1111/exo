# TLS termination, basic authentication and per-account permissions in front of the registry.
# The registry itself only listens on the internal compose network.

upstream registry {
  server registry:5000;
}

# Permissions: ci may push and delete, dev may only pull.
# An empty user is let through so that auth_basic answers 401 (docker login needs that challenge).
map "$remote_user:$request_method" $rbac_denied {
  default            1;
  "~^:"              0;
  "~^ci:"            0;
  "~^dev:(GET|HEAD)$" 0;
}

# The registry sets this header itself; add it when nginx answers on its own (401, 403).
map $upstream_http_docker_distribution_api_version $docker_distribution_api_version {
  ""      "registry/2.0";
}

server {
  listen 5000 ssl;
  http2 on;
  server_name registry.local localhost gateway;

  ssl_certificate     /etc/nginx/certs/registry.crt;
  ssl_certificate_key /etc/nginx/certs/registry.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Image layers can be several GB.
  client_max_body_size 0;
  chunked_transfer_encoding on;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /v2/ {
    auth_basic           "Shop SAS registry";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    if ($rbac_denied) {
      return 403;
    }

    add_header Docker-Distribution-Api-Version $docker_distribution_api_version always;

    proxy_pass         http://registry;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 900;
  }
}
