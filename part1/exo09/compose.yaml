services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dogs
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  logs-api:
    build: ./logs-api
    environment:
      DB_HOST: mysql
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  crud-api:
    build: ./crud-api
    environment:
      DB_HOST: mysql
      LOGS_HOST: logs-api
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      logs-api:
        condition: service_started
