# INCIDENT P1 — "La préprod ne répond plus depuis la mise à jour du compose de ce matin."
# Le dev qui l'a modifié est en congé. Vous avez 1h30. Ne modifiez pas le code applicatif.
name: incident
services:
  front:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ../../tp04-compose-entreprise/solution/apps/shopapi
    environment:
      DATABASE_URL: postgres://shop:shop@db:5432/shop
      REDIS_URL: redis://:r3dis@redis:6379
    networks:
      - public
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../tp04-compose-entreprise/solution/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "r3dis"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "r3dis", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  public:
  backend:
    internal: true

volumes:
  pgdata:
